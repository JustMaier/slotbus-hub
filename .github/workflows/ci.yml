name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Clone slotbus dependency
        uses: actions/checkout@v6
        with:
          repository: JustMaier/slotbus
          path: .slotbus
          token: ${{ secrets.SLOTBUS_PAT }}
      - name: Link slotbus to expected path
        run: ln -s "$PWD/.slotbus" ../slotbus
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt -p slotbus-hub -p slotbus-ffi -p slotbus-example-worker --check

  clippy:
    name: Clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - name: Clone slotbus dependency
        uses: actions/checkout@v6
        with:
          repository: JustMaier/slotbus
          path: .slotbus
          token: ${{ secrets.SLOTBUS_PAT }}
      - name: Link slotbus to expected path (Unix)
        if: runner.os != 'Windows'
        run: ln -s "$PWD/.slotbus" ../slotbus
      - name: Link slotbus to expected path (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: mklink /J "%CD%\..\slotbus" "%CD%\.slotbus"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - name: Clone slotbus dependency
        uses: actions/checkout@v6
        with:
          repository: JustMaier/slotbus
          path: .slotbus
          token: ${{ secrets.SLOTBUS_PAT }}
      - name: Link slotbus to expected path (Unix)
        if: runner.os != 'Windows'
        run: ln -s "$PWD/.slotbus" ../slotbus
      - name: Link slotbus to expected path (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: mklink /J "%CD%\..\slotbus" "%CD%\.slotbus"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@v6
      - name: Clone slotbus dependency
        uses: actions/checkout@v6
        with:
          repository: JustMaier/slotbus
          path: .slotbus
          token: ${{ secrets.SLOTBUS_PAT }}
      - name: Link slotbus to expected path
        run: ln -s "$PWD/.slotbus" ../slotbus
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps

  ffi-build:
    name: FFI Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - name: Clone slotbus dependency
        uses: actions/checkout@v6
        with:
          repository: JustMaier/slotbus
          path: .slotbus
          token: ${{ secrets.SLOTBUS_PAT }}
      - name: Link slotbus to expected path (Unix)
        if: runner.os != 'Windows'
        run: ln -s "$PWD/.slotbus" ../slotbus
      - name: Link slotbus to expected path (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: mklink /J "%CD%\..\slotbus" "%CD%\.slotbus"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build FFI crate
        run: cargo build -p slotbus-ffi --release
      - name: Verify DLL exists (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          DLL=target/release/slotbus_ffi.dll
          if [ ! -f "$DLL" ]; then echo "DLL not found"; exit 1; fi
          SIZE=$(stat -c%s "$DLL" 2>/dev/null || wc -c < "$DLL")
          echo "slotbus_ffi.dll: $SIZE bytes"
          if [ "$SIZE" -lt 10000 ]; then echo "DLL suspiciously small"; exit 1; fi
      - name: Verify exports (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          LIB=$(find target/release -maxdepth 1 -name 'libslotbus_ffi.so' -o -name 'libslotbus_ffi.dylib' | head -1)
          if [ -z "$LIB" ]; then echo "FFI library not found"; exit 1; fi
          nm -D "$LIB" 2>/dev/null || nm "$LIB" | grep -c "slotbus_" | xargs -I{} test {} -gt 0

  python-sdk-test:
    name: Python SDK (Windows)
    runs-on: windows-latest
    needs: ffi-build
    steps:
      - uses: actions/checkout@v6
      - name: Clone slotbus dependency
        uses: actions/checkout@v6
        with:
          repository: JustMaier/slotbus
          path: .slotbus
          token: ${{ secrets.SLOTBUS_PAT }}
      - name: Link slotbus to expected path
        shell: cmd
        run: mklink /J "%CD%\..\slotbus" "%CD%\.slotbus"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Build FFI DLL
        run: cargo build -p slotbus-ffi --release
      - name: Copy DLL to Python SDK
        shell: bash
        run: cp target/release/slotbus_ffi.dll sdks/python/slotbus/
      - name: Verify Python bindings load
        shell: bash
        working-directory: sdks/python
        run: |
          if [ -f slotbus/_native.py ]; then
            python -c "from slotbus._native import slotbus_version; print(slotbus_version())"
          else
            echo "Python SDK not yet implemented — skipping binding test"
          fi
      - name: Run Python tests
        shell: bash
        working-directory: sdks/python
        run: |
          if ls tests/*.py 1>/dev/null 2>&1 || ls test_*.py 1>/dev/null 2>&1; then
            pip install -e ".[test]" 2>/dev/null || pip install -e . 2>/dev/null || true
            python -m pytest tests/ -v 2>/dev/null || python -m pytest -v 2>/dev/null || echo "No runnable tests found"
          else
            echo "No test files found — skipping"
          fi

  node-sdk-test:
    name: Node SDK (Windows)
    runs-on: windows-latest
    needs: ffi-build
    steps:
      - uses: actions/checkout@v6
      - name: Clone slotbus dependency
        uses: actions/checkout@v6
        with:
          repository: JustMaier/slotbus
          path: .slotbus
          token: ${{ secrets.SLOTBUS_PAT }}
      - name: Link slotbus to expected path
        shell: cmd
        run: mklink /J "%CD%\..\slotbus" "%CD%\.slotbus"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: "18"
      - name: Build FFI DLL
        run: cargo build -p slotbus-ffi --release
      - name: Copy DLL to Node SDK
        shell: bash
        run: cp target/release/slotbus_ffi.dll sdks/node/lib/
      - name: Install Node dependencies
        working-directory: sdks/node
        run: |
          if [ -f package.json ]; then
            npm install
          else
            echo "No package.json — skipping npm install"
          fi
        shell: bash
      - name: Verify Node bindings load
        shell: bash
        working-directory: sdks/node
        run: |
          if [ -f lib/native.js ]; then
            node -e "const { slotbus_version } = require('./lib/native'); console.log(slotbus_version())"
          else
            echo "Node SDK not yet implemented — skipping binding test"
          fi
      - name: Run Node tests
        shell: bash
        working-directory: sdks/node
        run: |
          if [ -f package.json ] && grep -q '"test"' package.json; then
            npm test
          else
            echo "No test script found — skipping"
          fi
