name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            artifact: slotbus-hub-x86_64-pc-windows-msvc.exe
            bin: slotbus-hub.exe
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            artifact: slotbus-hub-x86_64-unknown-linux-gnu
            bin: slotbus-hub
          - target: x86_64-apple-darwin
            runner: macos-13
            artifact: slotbus-hub-x86_64-apple-darwin
            bin: slotbus-hub
          - target: aarch64-apple-darwin
            runner: macos-latest
            artifact: slotbus-hub-aarch64-apple-darwin
            bin: slotbus-hub
    steps:
      - uses: actions/checkout@v4
      - name: Clone slotbus dependency
        uses: actions/checkout@v4
        with:
          repository: jzipperle/slotbus
          path: ../slotbus
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary
        shell: bash
        run: cp target/${{ matrix.target }}/release/${{ matrix.bin }} ${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*

