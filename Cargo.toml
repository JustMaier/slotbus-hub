[workspace]
members = [".", "slotbus-ffi", "examples/rust-worker"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["Justin Zipperle"]
license = "MIT"

[package]
name = "slotbus-hub"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository = "https://github.com/JustMaier/slotbus-hub"
homepage = "https://github.com/JustMaier/slotbus-hub"
description = "HTTP-to-SHM router with worker SDK. Workers register routes, clients send HTTP — slotbus-hub dispatches via shared memory with sub-millisecond round trips."
categories = ["network-programming", "command-line-utilities"]
keywords = ["ipc", "shared-memory", "router", "http", "microservices"]
readme = "README.md"

[dependencies]
# For local development, use path dependency:
slotbus = { path = "../slotbus/slotbus" }
# For publishing, switch to: slotbus = "0.1"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }

# Hub binary dependencies
axum = "0.8"
postcard = { version = "1", features = ["alloc"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
tower-http = { version = "0.6", features = ["cors"] }
tokio-stream = { version = "0.1", features = ["sync"] }
