[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slotbus"
version = "0.1.0"
description = "Python SDK for slotbus shared-memory IPC"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Justin Zipperle" }]
keywords = ["ipc", "shared-memory", "ffi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
]

[project.urls]
Repository = "https://github.com/JustMaier/slotbus-hub"
